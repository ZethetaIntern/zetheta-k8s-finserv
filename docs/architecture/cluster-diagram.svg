<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="45" fill="#f0f6fc" font-size="24" font-weight="bold" text-anchor="middle">FinServ Digital - Production Kubernetes Cluster Architecture (PCI-DSS v4.0)</text>

  <!-- Outside: Traffic Ingress -->
  <rect x="50" y="80" width="1100" height="90" rx="10" fill="url(#boxGrad)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="105" fill="#58a6ff" font-size="14" font-weight="bold">EXTERNAL INGRESS &amp; PERIMETER SECURITY</text>
  
  <rect x="70" y="115" width="220" height="40" rx="6" fill="#238636" />
  <text x="180" y="140" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">FinServ Users (2.4M / 180k txns)</text>

  <path d="M 290 135 L 430 135" stroke="#8b949e" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />

  <rect x="430" y="115" width="280" height="40" rx="6" fill="#8957e5" />
  <text x="570" y="140" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Cloud WAF / DDoS Shield (Layer 7)</text>

  <path d="M 710 135 L 850 135" stroke="#8b949e" stroke-width="2" />

  <rect x="850" y="115" width="280" height="40" rx="6" fill="#1f6feb" />
  <text x="990" y="140" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Istio Ingress Gateway (TLS 1.3)</text>

  <!-- PRODUCTION KUBERNETES CLUSTER BOUNDARY -->
  <rect x="50" y="200" width="1100" height="570" rx="12" fill="#0d1117" stroke="#e3b341" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="200" width="1100" height="35" rx="10" fill="#e3b341" />
  <text x="600" y="224" fill="#0d1117" font-size="15" font-weight="bold" text-anchor="middle">PCI-DSS COMPLIANT HARDENED KUBERNETES WORKLOAD CLUSTER (prod-cluster)</text>

  <!-- HA Control Plane -->
  <rect x="80" y="255" width="1040" height="90" rx="8" fill="url(#boxGrad)" stroke="#30363d" stroke-width="1.5"/>
  <text x="100" y="278" fill="#e3b341" font-size="13" font-weight="bold">HIGH AVAILABILITY CONTROL PLANE (3 AZ Distributed)</text>
  
  <rect x="100" y="290" width="290" height="42" rx="5" fill="#21262d" stroke="#f0883e" stroke-width="1"/>
  <text x="245" y="316" fill="#f0f6fc" font-size="12" text-anchor="middle">kube-apiserver + Kyverno Admission</text>

  <rect x="420" y="290" width="300" height="42" rx="5" fill="#21262d" stroke="#da3633" stroke-width="1"/>
  <text x="570" y="316" fill="#f0f6fc" font-size="12" text-anchor="middle">etcd Cluster (KMS Encrypted at Rest)</text>

  <rect x="750" y="290" width="340" height="42" rx="5" fill="#21262d" stroke="#238636" stroke-width="1"/>
  <text x="920" y="316" fill="#f0f6fc" font-size="12" text-anchor="middle">Kube-apiserver Audit Logging Engine</text>

  <!-- Namespace Domains -->
  <!-- 1. System Pool / Infra -->
  <rect x="80" y="365" width="320" height="380" rx="8" fill="url(#boxGrad)" stroke="#30363d" stroke-width="1.5"/>
  <text x="100" y="390" fill="#a371f7" font-size="13" font-weight="bold">SYSTEM &amp; SECURITY SERVICES</text>
  
  <rect x="100" y="410" width="280" height="60" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1"/>
  <text x="240" y="435" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">HashiCorp Vault</text>
  <text x="240" y="455" fill="#8b949e" font-size="11" text-anchor="middle">Transit Encryption &amp; Dynamic DB Secrets</text>

  <rect x="100" y="490" width="280" height="60" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1"/>
  <text x="240" y="515" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">Falco Runtime Security</text>
  <text x="240" y="535" fill="#8b949e" font-size="11" text-anchor="middle">Kernel Syscall Sniffing &amp; Interactive Shell Detection</text>

  <rect x="100" y="570" width="280" height="60" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
  <text x="240" y="595" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">Observability Stack</text>
  <text x="240" y="615" fill="#8b949e" font-size="11" text-anchor="middle">Prometheus Metrics + Loki Audit Logging</text>

  <rect x="100" y="650" width="280" height="60" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="240" y="675" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">Calico CNI Provider</text>
  <text x="240" y="695" fill="#8b949e" font-size="11" text-anchor="middle">Zero-Trust Default-Deny Policies</text>

  <!-- 2. Payments Domain (Isolated CDE) -->
  <rect x="420" y="365" width="370" height="380" rx="8" fill="url(#boxGrad)" stroke="#f85149" stroke-width="1.5"/>
  <text x="440" y="390" fill="#f85149" font-size="13" font-weight="bold">PAYMENTS DOMAIN (prod-payments) [CDE]</text>
  <text x="440" y="405" fill="#8b949e" font-size="11">PSS: Restricted | Dedicated Tainted Nodes</text>

  <rect x="440" y="420" width="330" height="85" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="605" y="445" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Payment Gateway (PG)</text>
  <text x="605" y="465" fill="#7ee787" font-size="11" text-anchor="middle">HPA Autoscale: 3 to 25 Pods (5x Traffic Spike)</text>
  <text x="605" y="485" fill="#8b949e" font-size="11" text-anchor="middle">Sidecar: Vault Secret Injection</text>

  <rect x="440" y="525" width="330" height="75" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="605" y="550" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Transaction Processor (TP)</text>
  <text x="605" y="570" fill="#8b949e" font-size="11" text-anchor="middle">Strict mTLS (Istio Mutual) on Port 8443</text>
  <text x="605" y="588" fill="#8b949e" font-size="11" text-anchor="middle">ReadOnlyRootFilesystem + Non-Root (UID 10001)</text>

  <rect x="440" y="620" width="330" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="605" y="645" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Settlement &amp; Refund Engines</text>
  <text x="605" y="665" fill="#8b949e" font-size="11" text-anchor="middle">Isolated DB Egress to Encrypted RDS</text>

  <!-- 3. General Domains (Risk & Customer) -->
  <rect x="810" y="365" width="310" height="380" rx="8" fill="url(#boxGrad)" stroke="#30363d" stroke-width="1.5"/>
  <text x="830" y="390" fill="#3fb950" font-size="13" font-weight="bold">CONNECTED MICROSERVICES</text>
  <text x="830" y="405" fill="#8b949e" font-size="11">Cross-Namespace Restricted Communication</text>

  <!-- Risk Domain -->
  <rect x="825" y="420" width="280" height="135" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="965" y="445" fill="#d29922" font-size="12" font-weight="bold" text-anchor="middle">Namespace: prod-risk</text>
  <text x="965" y="475" fill="#f0f6fc" font-size="12" text-anchor="middle">Fraud Detection Engine</text>
  <text x="965" y="495" fill="#f0f6fc" font-size="12" text-anchor="middle">AML Screening Service</text>
  <text x="965" y="515" fill="#f0f6fc" font-size="12" text-anchor="middle">Audit Log Aggregator</text>
  <text x="965" y="535" fill="#8b949e" font-size="10" text-anchor="middle">(Whitelisted Egress from TP only)</text>

  <!-- Customer Domain -->
  <rect x="825" y="575" width="280" height="135" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="965" y="600" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Namespace: prod-customer</text>
  <text x="965" y="630" fill="#f0f6fc" font-size="12" text-anchor="middle">User Management</text>
  <text x="965" y="650" fill="#f0f6fc" font-size="12" text-anchor="middle">KYC Verification Service</text>
  <text x="965" y="670" fill="#f0f6fc" font-size="12" text-anchor="middle">Notification Service</text>
  <text x="965" y="695" fill="#8b949e" font-size="10" text-anchor="middle">(Zero direct access to prod-payments DB)</text>
</svg>
