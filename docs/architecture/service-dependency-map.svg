<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="100%" height="100%" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-risk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-audit" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <filter id="glow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="650" y="45" fill="#f3f4f6" font-size="22" font-weight="bold" text-anchor="middle">FinServ Digital - 20 Microservices Inter-Service Dependency Map</text>
  <text x="650" y="70" fill="#9ca3af" font-size="13" text-anchor="middle">Layer 3/4 Zero-Trust Explicit Allow Paths &amp; Strict Domain Segmentation</text>

  <!-- ================= DOMAIN 1: PLATFORM DOMAIN ================= -->
  <rect x="40" y="100" width="1220" height="130" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="40" y="100" width="1220" height="28" rx="8" fill="#374151" />
  <text x="60" y="120" fill="#93c5fd" font-size="12" font-weight="bold">PLATFORM DOMAIN (namespace: prod-platform)</text>

  <!-- 5 Services -->
  <rect x="60" y="145" width="210" height="60" rx="6" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="172" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">1. API Gateway</text>
  <text x="165" y="192" fill="#9ca3af" font-size="10" text-anchor="middle">External Ingress Routing</text>

  <rect x="305" y="145" width="210" height="60" rx="6" fill="#111827" stroke="#4b5563"/>
  <text x="410" y="172" fill="#e5e7eb" font-size="12" font-weight="bold" text-anchor="middle">2. Service Registry</text>
  <text x="410" y="192" fill="#9ca3af" font-size="10" text-anchor="middle">CoreDNS Discovery</text>

  <rect x="550" y="145" width="210" height="60" rx="6" fill="#111827" stroke="#4b5563"/>
  <text x="655" y="172" fill="#e5e7eb" font-size="12" font-weight="bold" text-anchor="middle">3. Configuration Service</text>
  <text x="655" y="192" fill="#9ca3af" font-size="10" text-anchor="middle">Central ConfigMaps</text>

  <rect x="795" y="145" width="210" height="60" rx="6" fill="#111827" stroke="#4b5563"/>
  <text x="900" y="172" fill="#e5e7eb" font-size="12" font-weight="bold" text-anchor="middle">4. Health Monitor</text>
  <text x="900" y="192" fill="#9ca3af" font-size="10" text-anchor="middle">Synthetic Probes</text>

  <rect x="1035" y="145" width="210" height="60" rx="6" fill="#111827" stroke="#4b5563"/>
  <text x="1140" y="172" fill="#e5e7eb" font-size="12" font-weight="bold" text-anchor="middle">5. Report Generator</text>
  <text x="1140" y="192" fill="#9ca3af" font-size="10" text-anchor="middle">Batch Reporting Job</text>

  <!-- ================= DOMAIN 2: PAYMENTS DOMAIN (CDE) ================= -->
  <rect x="40" y="260" width="760" height="380" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="40" y="260" width="760" height="28" rx="8" fill="#b91c1c" />
  <text x="60" y="280" fill="#ffffff" font-size="12" font-weight="bold">PAYMENTS DOMAIN (Cardholder Data Environment - prod-payments)</text>

  <!-- 5 Services -->
  <rect x="60" y="310" width="220" height="75" rx="6" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="170" y="340" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">6. Payment Gateway</text>
  <text x="170" y="360" fill="#9ca3af" font-size="10" text-anchor="middle">Auth &amp; Tokenization (HPA 3-25)</text>

  <rect x="340" y="310" width="220" height="75" rx="6" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="340" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">7. Transaction Processor</text>
  <text x="450" y="360" fill="#9ca3af" font-size="10" text-anchor="middle">Core Processing Engine</text>

  <rect x="60" y="440" width="220" height="75" rx="6" fill="#111827" stroke="#dc2626"/>
  <text x="170" y="470" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">8. Settlement Engine</text>
  <text x="170" y="490" fill="#9ca3af" font-size="10" text-anchor="middle">End-of-Day Clearing</text>

  <rect x="340" y="440" width="220" height="75" rx="6" fill="#111827" stroke="#dc2626"/>
  <text x="450" y="470" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">9. Refund Service</text>
  <text x="450" y="490" fill="#9ca3af" font-size="10" text-anchor="middle">Reversal Processing</text>

  <rect x="60" y="545" width="500" height="70" rx="6" fill="#111827" stroke="#dc2626"/>
  <text x="310" y="575" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">10. Recurring Payments Scheduler</text>
  <text x="310" y="595" fill="#9ca3af" font-size="10" text-anchor="middle">Subscription Cron Processing</text>

  <!-- External Banking APIs -->
  <rect x="600" y="380" width="180" height="120" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="690" y="420" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">External Banking</text>
  <text x="690" y="440" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">&amp; Card Networks</text>
  <text x="690" y="470" fill="#c7d2fe" font-size="10" text-anchor="middle">(RBI Whitelisted CIDRs)</text>

  <!-- ================= DOMAIN 3: RISK & COMPLIANCE DOMAIN ================= -->
  <rect x="830" y="260" width="430" height="380" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="830" y="260" width="430" height="28" rx="8" fill="#d97706" />
  <text x="850" y="280" fill="#ffffff" font-size="12" font-weight="bold">RISK &amp; COMPLIANCE DOMAIN (prod-risk)</text>

  <!-- 5 Services -->
  <rect x="850" y="310" width="185" height="65" rx="6" fill="#111827" stroke="#f59e0b"/>
  <text x="942" y="338" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">11. Fraud Detection</text>
  <text x="942" y="358" fill="#9ca3af" font-size="9" text-anchor="middle">Real-time ML Scoring</text>

  <rect x="1055" y="310" width="185" height="65" rx="6" fill="#111827" stroke="#f59e0b"/>
  <text x="1147" y="338" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">12. AML Screening</text>
  <text x="1147" y="358" fill="#9ca3af" font-size="9" text-anchor="middle">Sanction Checks</text>

  <rect x="850" y="405" width="185" height="65" rx="6" fill="#111827" stroke="#f59e0b"/>
  <text x="942" y="433" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">13. Risk Scoring</text>
  <text x="942" y="453" fill="#9ca3af" font-size="9" text-anchor="middle">Profile Thresholds</text>

  <rect x="1055" y="405" width="185" height="65" rx="6" fill="#111827" stroke="#f59e0b"/>
  <text x="1147" y="433" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">14. Compliance Report</text>
  <text x="1147" y="453" fill="#9ca3af" font-size="9" text-anchor="middle">Regulatory Export</text>

  <rect x="850" y="500" width="390" height="65" rx="6" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1045" y="528" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">15. Audit Log Aggregator</text>
  <text x="1045" y="548" fill="#9ca3af" font-size="10" text-anchor="middle">PCI-DSS Req 10 Immutable Event Collector</text>

  <!-- ================= DOMAIN 4: CUSTOMER DOMAIN ================= -->
  <rect x="40" y="670" width="1220" height="190" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="40" y="670" width="1220" height="28" rx="8" fill="#059669" />
  <text x="60" y="690" fill="#ffffff" font-size="12" font-weight="bold">CUSTOMER DOMAIN (prod-customer)</text>

  <!-- 5 Services -->
  <rect x="60" y="720" width="220" height="65" rx="6" fill="#111827" stroke="#10b981"/>
  <text x="170" y="748" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">16. User Management</text>
  <text x="170" y="768" fill="#9ca3af" font-size="10" text-anchor="middle">Auth &amp; Profile Store</text>

  <rect x="305" y="720" width="220" height="65" rx="6" fill="#111827" stroke="#10b981"/>
  <text x="415" y="748" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">17. KYC Verification</text>
  <text x="415" y="768" fill="#9ca3af" font-size="10" text-anchor="middle">Identity &amp; PAN/Aadhaar</text>

  <rect x="550" y="720" width="220" height="65" rx="6" fill="#111827" stroke="#10b981"/>
  <text x="660" y="748" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">18. Notification Service</text>
  <text x="660" y="768" fill="#9ca3af" font-size="10" text-anchor="middle">SMS / Email Dispatch</text>

  <rect x="795" y="720" width="220" height="65" rx="6" fill="#111827" stroke="#10b981"/>
  <text x="905" y="748" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">19. Customer Support</text>
  <text x="905" y="768" fill="#9ca3af" font-size="10" text-anchor="middle">Ticketing Engine</text>

  <rect x="1035" y="720" width="210" height="65" rx="6" fill="#111827" stroke="#10b981"/>
  <text x="1140" y="748" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">20. Preference Manager</text>
  <text x="1140" y="768" fill="#9ca3af" font-size="10" text-anchor="middle">User Settings &amp; Limits</text>

  <!-- ================= STRICT FLOW CONNECTOR ARROWS ================= -->
  <!-- API Gateway to Payment Gateway -->
  <path d="M 165 205 L 165 310" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- API Gateway to User Mgmt -->
  <path d="M 115 205 L 115 720" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />

  <!-- Payment Gateway to Transaction Processor -->
  <path d="M 280 345 L 340 345" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Transaction Processor to Fraud Detection (Cross-Domain) -->
  <path d="M 560 335 L 850 335" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrow-risk)" />

  <!-- Transaction Processor to Audit Log Aggregator -->
  <path d="M 450 385 L 450 535 L 850 535" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3" fill="none" marker-end="url(#arrow-audit)" />

  <!-- Transaction Processor to External Banking -->
  <path d="M 560 365 L 600 400" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Payment Gateway to Notification Service -->
  <path d="M 240 385 L 240 650 L 660 650 L 660 720" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4" fill="none" marker-end="url(#arrow)" />
</svg>
