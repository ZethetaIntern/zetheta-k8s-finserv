<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="45" fill="#f9fafb" font-size="22" font-weight="bold" text-anchor="middle">FinServ Digital - Zero-Trust Network Flow Architecture</text>
  <text x="600" y="70" fill="#9ca3af" font-size="13" text-anchor="middle">Calico Default-Deny L3/L4 Traffic Rules &amp; PCI-DSS CDE Isolation</text>

  <!-- External Zone -->
  <rect x="50" y="100" width="220" height="600" rx="10" fill="url(#netGrad)" stroke="#374151" stroke-width="1.5" filter="url(#boxShadow)"/>
  <rect x="50" y="100" width="220" height="30" rx="8" fill="#1f2937"/>
  <text x="160" y="120" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">UNTRUSTED ZONE</text>

  <rect x="70" y="150" width="180" height="60" rx="6" fill="#111827" stroke="#4b5563"/>
  <text x="160" y="185" fill="#e5e7eb" font-size="12" text-anchor="middle">Public Internet / Clients</text>

  <rect x="70" y="320" width="180" height="60" rx="6" fill="#111827" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="345" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">Unauthorized Scanner</text>
  <text x="160" y="365" fill="#ef4444" font-size="10" text-anchor="middle">Port Scans / SSRF Probe</text>

  <rect x="70" y="520" width="180" height="80" rx="6" fill="#111827" stroke="#3b82f6"/>
  <text x="160" y="550" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">Payment Networks</text>
  <text x="160" y="570" fill="#9ca3af" font-size="10" text-anchor="middle">Visa / Mastercard / NPCI</text>
  <text x="160" y="588" fill="#60a5fa" font-size="9" text-anchor="middle">(Whitelisted CIDR Egress)</text>

  <!-- Perimeter Ingress / WAF -->
  <rect x="310" y="100" width="180" height="600" rx="10" fill="url(#netGrad)" stroke="#374151" stroke-width="1.5" filter="url(#boxShadow)"/>
  <rect x="310" y="100" width="180" height="30" rx="8" fill="#1f2937"/>
  <text x="400" y="120" fill="#e5e7eb" font-size="12" font-weight="bold" text-anchor="middle">INGRESS PERIMETER</text>

  <rect x="325" y="150" width="150" height="70" rx="6" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="180" fill="#c4b5fd" font-size="12" font-weight="bold" text-anchor="middle">Cloud WAF</text>
  <text x="400" y="200" fill="#9ca3af" font-size="10" text-anchor="middle">TLS 1.3 Termination</text>

  <rect x="325" y="240" width="150" height="70" rx="6" fill="#111827" stroke="#3b82f6"/>
  <text x="400" y="270" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">API Gateway</text>
  <text x="400" y="290" fill="#9ca3af" font-size="10" text-anchor="middle">prod-platform:8080</text>

  <!-- Calico Zero Trust Boundary -->
  <rect x="530" y="100" width="620" height="600" rx="10" fill="#030712" stroke="#ef4444" stroke-width="2" filter="url(#boxShadow)"/>
  <rect x="530" y="100" width="620" height="30" rx="8" fill="#b91c1c"/>
  <text x="840" y="120" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">PCI-DSS SCOPE: CARDHOLDER DATA ENVIRONMENT (CDE)</text>

  <!-- Default-Deny Filter Banner -->
  <rect x="550" y="145" width="580" height="40" rx="4" fill="#1f2937" stroke="#dc2626"/>
  <text x="840" y="170" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">POLICY: DEFAULT-DENY ALL INGRESS &amp; EGRESS (networking.k8s.io/v1)</text>

  <!-- Allow Rule Pods -->
  <rect x="550" y="220" width="260" height="100" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="680" y="250" fill="#6ee7b7" font-size="13" font-weight="bold" text-anchor="middle">Payment Gateway Pods</text>
  <text x="680" y="275" fill="#9ca3af" font-size="11" text-anchor="middle">Ingress: from API Gateway (TCP 8443)</text>
  <text x="680" y="295" fill="#9ca3af" font-size="11" text-anchor="middle">Egress: to TP Pods (TCP 8443)</text>

  <rect x="870" y="220" width="260" height="100" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="1000" y="250" fill="#6ee7b7" font-size="13" font-weight="bold" text-anchor="middle">Transaction Processor</text>
  <text x="1000" y="275" fill="#9ca3af" font-size="11" text-anchor="middle">Ingress: from Payment Gateway (TCP 8443)</text>
  <text x="1000" y="295" fill="#9ca3af" font-size="11" text-anchor="middle">Egress: to Risk (9090) &amp; DB (5432)</text>

  <!-- System / Auxiliary Pods inside Cluster -->
  <rect x="550" y="370" width="260" height="90" rx="6" fill="#111827" stroke="#3b82f6"/>
  <text x="680" y="400" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">CoreDNS (kube-system)</text>
  <text x="680" y="425" fill="#9ca3af" font-size="10" text-anchor="middle">UDP/TCP Port 53 Egress Whitelisted</text>
  <text x="680" y="445" fill="#9ca3af" font-size="10" text-anchor="middle">(Mandatory Cluster DNS)</text>

  <rect x="870" y="370" width="260" height="90" rx="6" fill="#111827" stroke="#f59e0b"/>
  <text x="1000" y="400" fill="#fde68a" font-size="12" font-weight="bold" text-anchor="middle">HashiCorp Vault Server</text>
  <text x="1000" y="425" fill="#9ca3af" font-size="10" text-anchor="middle">TCP Port 8200 Egress (Sidecar Auth)</text>
  <text x="1000" y="445" fill="#9ca3af" font-size="10" text-anchor="middle">Dynamic Token Issuance</text>

  <!-- Encrypted RDS Store -->
  <rect x="710" y="510" width="300" height="90" rx="6" fill="#111827" stroke="#dc2626" stroke-width="1.5"/>
  <text x="860" y="540" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">PostgreSQL CDE Database</text>
  <text x="860" y="565" fill="#9ca3af" font-size="10" text-anchor="middle">TLS 1.3 + AWS KMS Encrypted Volumes</text>
  <text x="860" y="585" fill="#ef4444" font-size="10" text-anchor="middle">Zero Direct Public Routing</text>

  <!-- Connectors -->
  <!-- Internet to WAF -->
  <path d="M 250 180 L 325 180" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <!-- WAF to API Gateway -->
  <path d="M 400 220 L 400 240" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <!-- API Gateway to Payment Gateway -->
  <path d="M 475 275 L 550 275" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <!-- Payment Gateway to TP -->
  <path d="M 810 270 L 870 270" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <!-- TP to DB -->
  <path d="M 1000 320 L 1000 480 L 860 480 L 860 510" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- BLOCKED / ATTACK PATHS -->
  <!-- Attacker attempting direct CDE access -->
  <path d="M 250 350 L 530 350" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6" marker-end="url(#arrow-red)" />
  <text x="390" y="340" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">DROP (Default-Deny)</text>

  <!-- Attacker attempting direct DB access -->
  <path d="M 250 370 L 300 370 L 300 550 L 710 550" stroke="#ef4444" stroke-width="2" stroke-dasharray="6" fill="none" marker-end="url(#arrow-red)" />
  <text x="500" y="540" fill="#ef4444" font-size="10" font-weight="bold">DROP (No Direct Route)</text>
</svg>
