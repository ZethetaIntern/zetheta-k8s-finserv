apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened-microservice-template
  namespace: prod-payments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-secure-app
  template:
    metadata:
      labels:
        app: sample-secure-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: finserv-registry.internal/payments/sample:v1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
