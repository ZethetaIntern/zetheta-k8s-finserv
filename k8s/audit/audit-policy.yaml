apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - "RequestReceived"
rules:
  # Exclude high-volume noisy health/metric endpoints
  - level: None
    nonResourceURLs:
      - "/healthz*"
      - "/readyz*"
      - "/livez*"
      - "/metrics*"

  # Log Secret reads at Metadata level to avoid dumping actual secrets into logs
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]

  # Log authentication failures and unauthorized attempts with full body
  - level: RequestResponse
    verbs: ["get", "list", "create", "update", "patch", "delete"]
    omitStages:
      - "RequestReceived"

  # Log all administrative changes (mutations) across cluster resources
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
      - group: "apps"
      - group: "networking.k8s.io"
      - group: "rbac.authorization.k8s.io"

  # Fallback rule for everything else
  - level: Metadata
